name: MedicalPractice AI Workspace CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to full commit SHAs; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate MedicalPractice AI Workspace without Product checkout
        run: python .claude/scripts/validate_workspace.py --strict
      - name: Run workspace and guard tests
        run: python -m unittest discover -s .claude/tests -p 'test_*.py' -v
      - name: Confirm ignored local folders are not tracked
        run: |
          python .claude/scripts/repo_audit.py --workspace-only
